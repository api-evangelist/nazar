name: Nazar
description: Nazar (nazar.ai) is an AI-powered database performance and cost optimization
  platform that helps engineering and DBA teams monitor, analyze, and tune their databases.
  It supports Postgres, MySQL, SQL Server, MariaDB, Amazon Aurora, Oracle, and SAP HANA
  across cloud, on-premises, and hybrid environments. Capabilities include SQL.AI, an
  LLM-based tuning assistant, offensive SQL monitoring for slow-query detection, real-time
  lock visibility, and anomaly detection. Founded in Recife, Brazil and backed by 500
  Global, Nazar counts financial-services and travel companies among its customers.
